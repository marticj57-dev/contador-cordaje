<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#155e75"><link rel="manifest" href="manifest.json"><title>Contador de cordaje</title><style>
:root{font-family:system-ui,sans-serif;color:#17212b;background:#f4f7f8}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:820px;margin:auto}h1{font-size:1.6rem}p{line-height:1.4}.muted{color:#5e6b75;font-size:.9rem}.card{background:white;border:1px solid #dce4e8;border-radius:15px;padding:16px;margin:14px 0}.total{font-size:2rem;font-weight:750;margin-top:12px}label{display:block;font-size:.9rem;font-weight:600;margin:12px 0 5px}input,button{font:inherit;padding:11px;border:1px solid #bdcbd2;border-radius:9px;width:100%;min-height:44px;background:white;color:#17212b}button{font-weight:650;cursor:pointer;margin-top:8px}.primary{background:#155e75;color:white;border-color:#155e75}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.badge{background:#e1f2f5;color:#155e75;padding:5px 9px;border-radius:20px;font-size:.8rem}.top,.session{display:flex;align-items:center;justify-content:space-between;gap:10px}.session{border-top:1px solid #e1e7ea;padding:9px 0}.session button{width:auto;min-height:36px;padding:6px 10px;font-size:.82rem}.history{border-top:1px solid #e1e7ea;padding:12px 0}.notice{color:#155e75;font-weight:600;min-height:1.5em}.small{font-size:.82rem}@media(min-width:650px){.racquets{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
</style></head><body><h1>🎾 Contador de cordaje</h1><p class="muted">Registra sesiones con la fecha en que jugaste, también si fue un día anterior.</p><div id="racquets" class="racquets"></div><div id="notice" class="notice" role="status" aria-live="polite"></div><section class="card"><h2>Historial de cordajes rotos</h2><div id="history"></div><button id="export">Exportar copia de seguridad</button><label for="importFile">Restaurar una copia</label><input id="importFile" type="file" accept="application/json,.json"><p class="muted small">Haz copias periódicas para evitar perder los datos.</p></section><p class="muted small">Los datos se guardan en este navegador. No borres sus datos sin exportar antes una copia.</p>
<script>
(()=>{const KEY='contadorCordajeTenis_v1';const today=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};const defaults={rackets:[{name:'Raqueta 1',minutes:0,sessions:0,sessionLog:[]},{name:'Raqueta 2',minutes:0,sessions:0,sessionLog:[]}],history:[]};let state;try{let s=JSON.parse(localStorage.getItem(KEY));state=s&&Array.isArray(s.rackets)&&s.rackets.length===2&&Array.isArray(s.history)?s:structuredClone(defaults);state.rackets.forEach(r=>{if(!Array.isArray(r.sessionLog))r.sessionLog=[]});state.history.forEach(h=>{if(!Array.isArray(h.sessionLog))h.sessionLog=[]});state.rackets.forEach(r=>{if(r.sessions>0&&!r.sessionLog.length)r.legacySessions=true})}catch{state=structuredClone(defaults)}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>{let h=Math.floor(n/60),m=n%60;return h?(m?`${h} h ${m} min`:`${h} h`):`${m} min`},dateFmt=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:'Fecha no indicada',save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function render(){$('racquets').innerHTML=state.rackets.map((r,i)=>`<section class="card"><div class="top"><strong>RAQUETA ${i+1}</strong><span class="badge">Cordaje actual</span></div><label for="name${i}">Nombre</label><input id="name${i}" maxlength="35" value="${esc(r.name)}"><div class="total">${fmt(r.minutes)}</div><div class="muted">${r.sessions} sesiones desde el último encordado</div><div class="row"><div><label for="mins${i}">Minutos jugados</label><input id="mins${i}" type="number" min="1" max="600" step="1" value="90"></div><div><label for="date${i}">Fecha de la sesión</label><input id="date${i}" type="date" value="${today()}"></div></div><button class="primary" data-add="${i}">+ Registrar sesión</button><button data-break="${i}">Cordaje roto: guardar y reiniciar</button><h3 style="font-size:1rem;margin-bottom:4px">Sesiones del cordaje actual</h3>${r.sessionLog.length?r.sessionLog.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="session"><div><strong>${dateFmt(s.date)}</strong><div class="muted small">${fmt(s.minutes)}</div></div><button data-del="${i}" data-id="${esc(s.id)}">Eliminar</button></div>`).join(''):(r.legacySessions?'<p class="muted small">El total antiguo se conserva, pero las sesiones anteriores no tienen fecha individual.</p>':'<p class="muted small">Todavía no hay sesiones registradas.</p>')}</section>`).join('');
$('history').innerHTML=state.history.length?state.history.slice().reverse().map(h=>`<div class="history"><strong>${esc(h.name)} — ${fmt(h.minutes)}</strong><div class="muted small">Rotura: ${dateFmt(h.breakDate)} · ${h.sessions} sesiones</div>${h.sessionLog?.length?`<details><summary class="muted small">Ver sesiones (${h.sessionLog.length})</summary>${h.sessionLog.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(s=>`<div class="muted small">${dateFmt(s.date)}: ${fmt(s.minutes)}</div>`).join('')}</details>`:''}</div>`).join(''):'<p class="muted">Todavía no hay cordajes registrados.</p>'}
$('racquets').addEventListener('click',e=>{let a=e.target.closest('[data-add]'),b=e.target.closest('[data-break]'),d=e.target.closest('[data-del]');
if(a){let i=+a.dataset.add,m=Number($('mins'+i).value),date=$('date'+i).value,name=$('name'+i).value.trim()||`Raqueta ${i+1}`;if(!Number.isInteger(m)||m<1||m>600){$('notice').textContent='Introduce minutos enteros entre 1 y 600.';return}if(!date){$('notice').textContent='Selecciona una fecha válida.';return}let r=state.rackets[i];r.name=name;r.minutes+=m;r.sessions++;r.sessionLog.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),date,minutes:m});r.legacySessions=false;save();render();$('notice').textContent=`Sesión añadida: ${fmt(m)} el ${dateFmt(date)}.`}
else if(b){let i=+b.dataset.break,r=state.rackets[i],name=$('name'+i).value.trim()||r.name||`Raqueta ${i+1}`;if(!r.sessions){$('notice').textContent='Esta raqueta todavía no tiene sesiones registradas.';return}if(!confirm(`¿Confirmas que se ha roto el cordaje de ${name}? Se guardarán ${fmt(r.minutes)} y las fechas de las sesiones.`))return;state.history.push({name,minutes:r.minutes,sessions:r.sessions,breakDate:today(),sessionLog:r.sessionLog||[]});state.rackets[i]={name,minutes:0,sessions:0,sessionLog:[]};save();render();$('notice').textContent='Cordaje guardado en el historial y contador reiniciado.'}
else if(d){let i=+d.dataset.del,id=d.dataset.id,r=state.rackets[i],s=r.sessionLog.find(x=>x.id===id);if(!s)return;if(!confirm(`¿Eliminar la sesión del ${dateFmt(s.date)} (${fmt(s.minutes)})?`))return;r.sessionLog=r.sessionLog.filter(x=>x.id!==id);r.minutes=Math.max(0,r.minutes-s.minutes);r.sessions=Math.max(0,r.sessions-1);save();render();$('notice').textContent='Sesión eliminada y total actualizado.'}});
$('racquets').addEventListener('change',e=>{if(e.target.matches('input[id^="name"]')){let i=+e.target.id.replace('name',''),n=e.target.value.trim();if(n)state.rackets[i].name=n;save()}});
$('export').addEventListener('click',()=>{save();let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`copia-contador-cordaje-${today()}.json`;a.click();URL.revokeObjectURL(url);$('notice').textContent='Copia de seguridad exportada.'});
$('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let c=JSON.parse(await f.text());if(!Array.isArray(c.rackets)||c.rackets.length!==2||!Array.isArray(c.history))throw Error();if(!confirm('Restaurar sustituirá los datos actuales. ¿Continuar?'))return;c.rackets.forEach(r=>{if(!Array.isArray(r.sessionLog))r.sessionLog=[]});c.history.forEach(h=>{if(!Array.isArray(h.sessionLog))h.sessionLog=[]});state=c;save();render();$('notice').textContent='Copia restaurada.'}catch{$('notice').textContent='No se pudo leer la copia JSON.'}e.target.value=''});
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
